{% extends 'expenses/base.html' %}

{% block content %}
<h2>Delete Expense</h2>

<p>Are you sure you want to delete "{{ object.title }}" expense of ${{ object.amount }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'expense-list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
